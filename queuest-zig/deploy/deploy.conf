# deploy/deploy.conf  -- the only per-project deploy file (see DEPLOY-RULES.md in the infra repo)
NAME=queuest
DOMAIN=api.queuest.c7d5a6.com
PORT=3002
START=./queuest-zig
HEALTH=/api/hello
# The SQLite database lives in shared/data and survives releases.
SHARED=(.env data/)
# Baz is always built ReleaseSafe by build.zig; this only speeds up our own code and sqlite.
build() {
  zig build -Doptimize=ReleaseFast -Dtarget="$ZIG_TARGET" --prefix "$OUT/.p"
  mv "$OUT/.p/bin/queuest-zig" "$OUT/"
  rm -rf "$OUT/.p"
}
